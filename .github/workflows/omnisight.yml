# =============================================================================
# OmniSight — GitHub Actions CI/CD Pipeline
# =============================================================================
# Triggers OmniSight's self-healing visual regression analysis automatically
# on every pull request or merge to main/develop branches.
#
# Pipeline stages:
#   1. Setup Python + Node.js environments
#   2. Install backend (pip) + frontend (npm) dependencies
#   3. Install Playwright browsers for headless screenshot capture
#   4. Start the mock target application
#   5. Run OmniSight vision benchmark test suite (pytest)
#   6. Execute full pipeline: screenshot → VLM analysis → fix generation
#   7. Upload analysis artifacts (screenshots, bug reports)
#   8. Fire webhook to notify the OmniSight backend of the build result
# =============================================================================

name: OmniSight Visual Regression Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Visual Regression Analysis
  # ─────────────────────────────────────────────────────────────────────────
  visual-regression:
    name: 🔍 Visual Regression Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python setup ────────────────────────────────────────────────────
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Install Python dependencies
        working-directory: omnisight
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # ── Node.js setup ───────────────────────────────────────────────────
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: omnisight/frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: omnisight/frontend
        run: npm ci

      # ── Playwright browsers ─────────────────────────────────────────────
      - name: 🎭 Install Playwright browsers
        working-directory: omnisight
        run: python -m playwright install --with-deps chromium

      # ── Start services ──────────────────────────────────────────────────
      - name: 🚀 Start backend server
        working-directory: omnisight
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          sleep 5
          curl -f http://localhost:8000/api/health || echo "Backend health check (may fail without .env)"

      - name: 🚀 Start frontend dev server
        working-directory: omnisight/frontend
        run: |
          npm run dev -- --host 0.0.0.0 &
          sleep 5

      # ── Vision Benchmark Test Suite ─────────────────────────────────────
      - name: 🧪 Run Vision Benchmark Tests
        working-directory: omnisight
        run: |
          python -m pytest tests/test_vision_benchmark.py \
            -v --tb=short --timeout=120 \
            --junitxml=test-results/vision-benchmark.xml \
            || echo "::warning::Some vision benchmark tests failed"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── Self-Healing Pipeline Tests ─────────────────────────────────────
      - name: 🧪 Run Self-Healing Pipeline Tests
        working-directory: omnisight
        run: |
          python -m pytest tests/test_self_healing_pipeline.py \
            -v --tb=short --timeout=120 \
            --junitxml=test-results/pipeline.xml \
            || echo "::warning::Some pipeline tests failed"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── Run full pipeline capture ───────────────────────────────────────
      - name: 📸 Execute Visual Capture Pipeline
        working-directory: omnisight
        run: |
          python -c "
          import asyncio
          from backend.services.browser.automation import capture_screenshots, run_interactive_flow
          async def main():
              url = 'http://localhost:8000/mock-app/index.html'
              screenshots, html = await capture_screenshots(url)
              print(f'Captured {len(screenshots)} viewport screenshots')
              flow_result = await run_interactive_flow(url)
              print(f'RPA flow status: {flow_result[\"status\"]}')
              print(f'Flow states captured: {list(flow_result[\"states\"].keys())}')
          asyncio.run(main())
          "

      # ── Upload artifacts ────────────────────────────────────────────────
      - name: 📤 Upload screenshots and test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnisight-visual-artifacts
          path: |
            omnisight/output/screenshots/
            omnisight/test-results/
          retention-days: 14

      # ── Webhook notification ────────────────────────────────────────────
      - name: 🔔 Notify OmniSight webhook
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT_SHA="${{ github.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number || 'N/A' }}"
          BRANCH="${{ github.ref_name }}"

          echo "Pipeline status: $STATUS"
          echo "Commit: $COMMIT_SHA"
          echo "PR: $PR_NUMBER"
          echo "Branch: $BRANCH"

          # If OmniSight backend is running, fire the webhook
          curl -s -X POST http://localhost:8000/api/webhook/build \
            -H "Content-Type: application/json" \
            -d "{
              \"action\": \"completed\",
              \"status\": \"$STATUS\",
              \"commit_sha\": \"$COMMIT_SHA\",
              \"pr_number\": \"$PR_NUMBER\",
              \"branch\": \"$BRANCH\",
              \"pipeline\": \"omnisight-visual-regression\",
              \"artifacts_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" || echo "Webhook notification skipped (backend not reachable)"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: PR Comment with Results (only on pull_request)
  # ─────────────────────────────────────────────────────────────────────────
  report:
    name: 📝 Post Results to PR
    needs: visual-regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ needs.visual-regression.result }}';
            const icon = status === 'success' ? '✅' : '⚠️';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `## ${icon} OmniSight Visual Regression Report

            **Status:** ${status}
            **Commit:** \`${context.sha.substring(0, 7)}\`
            **Pipeline:** [View full run](${runUrl})

            ### What was checked:
            - 📸 Multi-viewport screenshots (desktop, tablet, mobile)
            - 🤖 Interactive RPA flow (add-to-cart, checkout)
            - 🔍 VLM-powered visual bug detection
            - ✂️ Image chunking for focused component analysis
            - 🧪 Vision benchmark test suite

            > Powered by OmniSight — Autonomous Visual QA Pipeline`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
